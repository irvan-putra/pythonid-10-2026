<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Camera</title>
<button id="start" style="font-size: 2em">📷 Start</button>
<p id="info" style="font-size: 1.5em"></p>
<video id="video" playsinline muted style="width: 100%"></video>
<script>
start.onclick = async () => {
  const backCamera = { video: { facingMode: "environment", width: 640 } };
  video.srcObject = await navigator.mediaDevices.getUserMedia(backCamera);
  await video.play();
  const protocol = location.protocol === "https:" ? "wss" : "ws";  // secure page -> secure socket
  const ws = new WebSocket(`${protocol}://${location.host}/camera`);
  const canvas = document.createElement("canvas");
  const send = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    canvas.toBlob((jpeg) => ws.send(jpeg), "image/jpeg", 0.7);
  };
  ws.onopen = send;
  ws.onmessage = (event) => { info.textContent = event.data; send(); };
  start.disabled = true;
};
</script>
