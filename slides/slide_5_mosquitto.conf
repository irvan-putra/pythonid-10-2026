# Without this file, Mosquitto 2.0 runs in "local only mode":
# only programs on the laptop itself can connect, not the phone.

# Listen on port 1883 on every network interface, including Wi-Fi
listener 1883

# A listener requires a login by default; let clients connect without one
allow_anonymous true

# Bridge: also forward the dashboard's data to a free public broker online,
# where the online dashboard (pythonid-10-2026.streamlit.app) subscribes.
# A public broker has no password: anyone can read or publish these topics,
# so never send private data through it.
connection cloud
address broker.hivemq.com:1883
topic votes out 0 pythonid/ irvan-putra/pythonid-10-2026/
topic speech out 0 pythonid/ irvan-putra/pythonid-10-2026/
